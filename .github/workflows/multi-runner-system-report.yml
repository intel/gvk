name: Multi-Runner System Report

on:
  workflow_dispatch:  # Manual trigger only
  # push:  # Disabled - manual trigger only
  #   branches:
  #     - setup-github-actions
  #   paths:
  #     - '.github/workflows/multi-runner-system-report.yml'

jobs:
  report-all-runners:
    name: Report - ${{ matrix.runner-name }}
    strategy:
      matrix:
        include:
          - runner-name: godzilla
            runner-labels: [self-hosted, Linux, X64, nvidia-rtx6000]
          - runner-name: mage-b580
            runner-labels: [self-hosted, Linux, X64, intel-b580]
      fail-fast: false  # Continue even if one runner fails

    runs-on: ${{ matrix.runner-labels }}
    timeout-minutes: 10

    steps:
    - name: Generate System Report
      run: |
        REPORT_FILE="${{ matrix.runner-name }}-report.md"

        echo "# System Report: ${{ matrix.runner-name }}" > "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "**Generated:** $(date +"%Y-%m-%d %H:%M:%S")" >> "$REPORT_FILE"
        echo "**Runner Labels:** ${{ join(matrix.runner-labels, ', ') }}" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "---" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "## Runner Information" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "Runner Name: $RUNNER_NAME" >> "$REPORT_FILE"
        echo "Runner OS: $RUNNER_OS" >> "$REPORT_FILE"
        echo "Runner Architecture: $RUNNER_ARCH" >> "$REPORT_FILE"
        echo "Hostname: $(hostname)" >> "$REPORT_FILE"
        echo "User: $(whoami)" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "---" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "## Operating System" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        cat /etc/os-release >> "$REPORT_FILE" 2>&1
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "**Kernel:** \`$(uname -r)\`" >> "$REPORT_FILE"
        echo "**Architecture:** \`$(uname -m)\`" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "---" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "## Hardware" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "### CPU" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        lscpu | grep -E "Model name|Architecture|CPU\(s\):|Thread|Core|Socket|Vendor ID" >> "$REPORT_FILE" 2>&1
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### Memory" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        free -h >> "$REPORT_FILE" 2>&1
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### Disk Space" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        df -h | grep -E "Filesystem|/dev/" >> "$REPORT_FILE" 2>&1
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "---" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "## GPU Information" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "### PCI Devices" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        lspci | grep -i "vga\|3d\|display" >> "$REPORT_FILE" 2>&1 || echo "No GPU found" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### GPU Driver Modules" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        lsmod | grep -E "nvidia|amdgpu|i915|xe" >> "$REPORT_FILE" 2>&1 || echo "No GPU drivers loaded" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### NVIDIA Info" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        nvidia-smi >> "$REPORT_FILE" 2>&1 || echo "nvidia-smi not available" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "---" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "## Docker" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "### Docker Version" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        docker --version >> "$REPORT_FILE" 2>&1 || echo "Docker not installed" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### Docker Info" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        docker info 2>&1 | head -n 30 >> "$REPORT_FILE" || echo "Docker daemon not running" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "---" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "## Build Tools" >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"
        echo "### CMake" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        cmake --version >> "$REPORT_FILE" 2>&1 || echo "CMake not installed" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### Ninja" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        ninja --version >> "$REPORT_FILE" 2>&1 || echo "Ninja not installed" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### GCC/G++" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        gcc --version 2>&1 | head -n1 >> "$REPORT_FILE" || echo "GCC not installed" >> "$REPORT_FILE"
        g++ --version 2>&1 | head -n1 >> "$REPORT_FILE" || echo "G++ not installed" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### Clang/Clang++" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        clang --version 2>&1 | head -n1 >> "$REPORT_FILE" || echo "Clang not installed" >> "$REPORT_FILE"
        clang++ --version 2>&1 | head -n1 >> "$REPORT_FILE" || echo "Clang++ not installed" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "### Vulkan Tools" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        vulkaninfo --summary >> "$REPORT_FILE" 2>&1 || echo "vulkaninfo not available" >> "$REPORT_FILE"
        echo '```' >> "$REPORT_FILE"
        echo "" >> "$REPORT_FILE"

        echo "Report generated successfully"
        cat "$REPORT_FILE"

    - name: Display Report in Job Summary
      run: |
        REPORT_FILE="${{ matrix.runner-name }}-report.md"
        cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY

    - name: Upload Runner Report
      uses: actions/upload-artifact@v4
      with:
        name: report-${{ matrix.runner-name }}
        path: ${{ matrix.runner-name }}-report.md
        retention-days: 30

  compare-runners:
    name: Compare Runners
    needs: [report-all-runners]
    runs-on: [self-hosted, Linux, X64]
    if: always()
    timeout-minutes: 5

    steps:
    - name: Download All Reports
      uses: actions/download-artifact@v4
      with:
        pattern: report-*
        path: reports/
        merge-multiple: true

    - name: Generate Comparison Report
      run: |
        COMPARISON="runner-comparison.md"

        echo "# Runner Comparison Report" > "$COMPARISON"
        echo "" >> "$COMPARISON"
        echo "**Generated:** $(date +"%Y-%m-%d %H:%M:%S")" >> "$COMPARISON"
        echo "" >> "$COMPARISON"
        echo "---" >> "$COMPARISON"
        echo "" >> "$COMPARISON"

        # Count available reports
        GODZILLA_EXISTS=$([ -f "reports/godzilla-report.md" ] && echo "yes" || echo "no")
        MAGE_EXISTS=$([ -f "reports/mage-b580-report.md" ] && echo "yes" || echo "no")

        echo "## Runners Detected" >> "$COMPARISON"
        echo "" >> "$COMPARISON"
        echo "- **godzilla (NVIDIA RTX 6000):** $GODZILLA_EXISTS" >> "$COMPARISON"
        echo "- **mage-b580 (Intel B580):** $MAGE_EXISTS" >> "$COMPARISON"
        echo "" >> "$COMPARISON"
        echo "---" >> "$COMPARISON"
        echo "" >> "$COMPARISON"

        # Extract key information for comparison
        echo "## Quick Comparison" >> "$COMPARISON"
        echo "" >> "$COMPARISON"
        echo "| Feature | godzilla | mage-b580 |" >> "$COMPARISON"
        echo "|---------|----------|-----------|" >> "$COMPARISON"

        # Docker version
        if [ -f "reports/godzilla-report.md" ]; then
          GODZILLA_DOCKER=$(grep -A 3 "### Docker Version" reports/godzilla-report.md | grep -v "###" | grep -v '```' | xargs || echo "N/A")
        else
          GODZILLA_DOCKER="Report missing"
        fi

        if [ -f "reports/mage-b580-report.md" ]; then
          MAGE_DOCKER=$(grep -A 3 "### Docker Version" reports/mage-b580-report.md | grep -v "###" | grep -v '```' | xargs || echo "N/A")
        else
          MAGE_DOCKER="Report missing"
        fi

        echo "| Docker | $GODZILLA_DOCKER | $MAGE_DOCKER |" >> "$COMPARISON"

        # GPU
        if [ -f "reports/godzilla-report.md" ]; then
          GODZILLA_GPU=$(grep -A 3 "### PCI Devices" reports/godzilla-report.md | grep -i "vga\|3d\|display" | head -n1 | cut -d: -f3- | xargs || echo "N/A")
        else
          GODZILLA_GPU="Report missing"
        fi

        if [ -f "reports/mage-b580-report.md" ]; then
          MAGE_GPU=$(grep -A 3 "### PCI Devices" reports/mage-b580-report.md | grep -i "vga\|3d\|display" | head -n1 | cut -d: -f3- | xargs || echo "N/A")
        else
          MAGE_GPU="Report missing"
        fi

        echo "| GPU | $GODZILLA_GPU | $MAGE_GPU |" >> "$COMPARISON"

        echo "" >> "$COMPARISON"
        echo "---" >> "$COMPARISON"
        echo "" >> "$COMPARISON"

        # Include full reports
        echo "## Full Reports" >> "$COMPARISON"
        echo "" >> "$COMPARISON"

        if [ -f "reports/godzilla-report.md" ]; then
          cat reports/godzilla-report.md >> "$COMPARISON"
          echo "" >> "$COMPARISON"
          echo "---" >> "$COMPARISON"
          echo "" >> "$COMPARISON"
        fi

        if [ -f "reports/mage-b580-report.md" ]; then
          cat reports/mage-b580-report.md >> "$COMPARISON"
        fi

        echo "" >> "$COMPARISON"
        echo "---" >> "$COMPARISON"
        echo "" >> "$COMPARISON"
        echo "## Recommendations" >> "$COMPARISON"
        echo "" >> "$COMPARISON"

        # Check if Docker versions match
        if [ "$GODZILLA_DOCKER" = "$MAGE_DOCKER" ] && [ "$GODZILLA_DOCKER" != "N/A" ] && [ "$GODZILLA_DOCKER" != "Report missing" ]; then
          echo "? **Docker versions match** - Good for consistent builds" >> "$COMPARISON"
        else
          echo "??  **Docker versions differ** - May need to handle differences" >> "$COMPARISON"
        fi
        echo "" >> "$COMPARISON"

        echo "?? **Testing Strategy:**" >> "$COMPARISON"
        echo "- Build in Docker on any available runner" >> "$COMPARISON"
        echo "- Test on both godzilla (NVIDIA) and mage-b580 (Intel)" >> "$COMPARISON"
        echo "- This will catch GPU/driver-specific Vulkan issues" >> "$COMPARISON"

        cat "$COMPARISON"

    - name: Upload Comparison Report
      uses: actions/upload-artifact@v4
      with:
        name: runner-comparison-report
        path: runner-comparison.md
        retention-days: 30

    - name: Display Comparison in Job Summary
      run: |
        cat runner-comparison.md >> $GITHUB_STEP_SUMMARY
