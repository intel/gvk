name: Build & Test

on:
  # Auto-trigger DISABLED for safe testing
  # Uncomment these when you're ready to install packages:
  # push:
  #   branches:
  #     - trunk
  #     - setup-github-actions
  # pull_request:
  #   branches:
  #     - trunk
  workflow_dispatch:  # Manual trigger ONLY - safe for testing
  # schedule:
  #   - cron: '30 5 * * *' # Daily 5:30 AM UTC / 12:30 AM EST

env:
  BUILD_TYPE: Release

jobs:
  check-environment:
    name: Check Runner Environment
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    outputs:
      docker-available: ${{ steps.check-docker.outputs.available }}

    steps:
    - name: Check Docker Availability
      id: check-docker
      run: |
        echo "=== Checking Docker ==="
        if command -v docker &> /dev/null; then
          echo "? Docker is installed"
          docker --version || true

          if docker info &> /dev/null; then
            echo "? Docker daemon is running"
            echo "? Docker is fully operational"
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "??  Docker is installed but daemon is not running"
            echo "   You could use Docker if you start the daemon"
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "??  Docker is not installed"
          echo "   This is fine! The workflow will use native builds"
          echo "available=false" >> $GITHUB_OUTPUT
        fi

        echo ""
        echo "=== Checking Native Build Tools ==="

        # Check for required native build tools
        MISSING_TOOLS=()

        if command -v cmake &> /dev/null; then
          echo "? CMake: $(cmake --version | head -n1)"
        else
          echo "??  CMake: Not found (will be installed)"
          MISSING_TOOLS+=("cmake")
        fi

        if command -v ninja &> /dev/null; then
          echo "? Ninja: $(ninja --version)"
        else
          echo "??  Ninja: Not found (will be installed)"
          MISSING_TOOLS+=("ninja-build")
        fi

        if command -v gcc &> /dev/null; then
          echo "? GCC: $(gcc --version | head -n1)"
        else
          echo "??  GCC: Not found (will be installed)"
          MISSING_TOOLS+=("build-essential")
        fi

        echo ""
        if [ ${#MISSING_TOOLS[@]} -eq 0 ]; then
          echo "? All native build tools are ready!"
        else
          echo "??  These packages will be installed: ${MISSING_TOOLS[*]}"
        fi

    - name: Environment Summary
      run: |
        echo "================================"
        echo "ENVIRONMENT CHECK COMPLETE"
        echo "================================"
        echo ""
        echo "Docker Available: ${{ steps.check-docker.outputs.available }}"
        echo ""
        echo "Build Strategy: Native Linux build with apt-get"
        echo ""
        echo "Next: Proceeding with Linux build..."

  # build-windows:
  #   name: Build Windows
  #   runs-on: [self-hosted, windows]
  #   timeout-minutes: 60
  #   
  #   Windows runner not available - commented out
  #   Uncomment this section when Windows runner is set up

  build-linux:
    name: Build Linux
    runs-on: [self-hosted, linux]
    needs: check-environment
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # INSTALLATION DISABLED FOR SAFE TESTING
    # Uncomment this step when you're ready to actually install packages
    # - name: Install Build Dependencies
    #   run: |
    #     # Update package list
    #     sudo apt-get update
    #
    #     # Install core build tools
    #     sudo apt-get install -y \
    #       build-essential \
    #       cmake \
    #       ninja-build \
    #       git \
    #       python3 \
    #       pkg-config
    #
    #     # Install Vulkan and graphics dependencies
    #     sudo apt-get install -y \
    #       libwayland-dev \
    #       wayland-protocols \
    #       libxkbcommon-dev \
    #       libxrandr-dev \
    #       libxinerama-dev \
    #       libxcursor-dev \
    #       libxi-dev \
    #       libx11-xcb-dev \
    #       libxxf86vm-dev \
    #       xorg-dev

    - name: Check System Information
      run: |
        echo "=== System Information ==="
        lscpu | grep -E "Model name|CPU\(s\)|Thread" || true
        echo ""
        free -h
        echo ""
        echo "=== Build Tools ==="
        cmake --version || echo "CMake not found"
        ninja --version || echo "Ninja not found"
        gcc --version | head -n1 || echo "GCC not found"
        python3 --version || echo "Python3 not found"
        echo ""
        echo "NOTE: Installation is currently DISABLED for safe testing"
        echo "      This build will likely fail if tools are missing"
        echo "      Uncomment 'Install Build Dependencies' step to enable installation"

    - name: Configure CMake
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -Dgvk-default_ENABLED=OFF \
          -Dgvk-string_ENABLED=ON \
          -Dgvk-build-tests=ON \
          -Dgvk-build-samples=OFF
      continue-on-error: true

    - name: Build
      run: cmake --build build --target install --parallel
      continue-on-error: true

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure --timeout 300
      continue-on-error: true

    - name: Upload Build Artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: gvk-linux-x64
        path: install/
        retention-days: 7

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux
        path: build/Testing/
        retention-days: 7

  status-check:
    name: Status Check
    needs: [check-environment, build-linux]  # Only Linux runner available
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    if: always()

    steps:
    - name: Check Build Status
      run: |
        echo "Environment Check: ${{ needs.check-environment.result }}"
        echo "Linux Build: ${{ needs.build-linux.result }}"
        echo ""
        echo "Docker Available: ${{ needs.check-environment.outputs.docker-available }}"
        echo ""

        if [ "${{ needs.check-environment.result }}" != "success" ] || \
           [ "${{ needs.build-linux.result }}" != "success" ]; then
          echo "? Build failed"
          exit 1
        fi

        echo "? All builds successful"
