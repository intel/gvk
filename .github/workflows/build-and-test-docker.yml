    - name: Display Test Results
      if: always()
      working-directory: gvk-test-package
      run: |
        echo "## Test Results - mage-b580 (Intel B580)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f test-results.xml ]; then
          # Parse XML for accurate test counts
          TESTS=$(grep -oP 'tests="\K\d+' test-results.xml | head -1 || echo "0")
          FAILURES=$(grep -oP 'failures="\K\d+' test-results.xml | head -1 || echo "0")
          ERRORS=$(grep -oP 'errors="\K\d+' test-results.xml | head -1 || echo "0")
          PASSED=$((TESTS - FAILURES - ERRORS))

          if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ] && [ "$TESTS" != "0" ]; then
