        path: gvk-test-package/test-results.xml
        retention-days: 30

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: gvk-test-package/test-results.xml
        check_name: "Test Results (mage-b580 - Intel B580)"
        comment_mode: off

  status:
    name: Build & Test Status
    needs: [build, test-godzilla, test-mage]
    runs-on: [self-hosted, Linux, X64]
    if: always()
    timeout-minutes: 5

    steps:
    - name: Check Status
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test godzilla (NVIDIA): ${{ needs.test-godzilla.result }}"
        echo "Test mage-b580 (Intel): ${{ needs.test-mage.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "? Build failed"
          exit 1
        fi

        # Test failures are warnings, not hard failures (for now)
        if [ "${{ needs.test-godzilla.result }}" != "success" ] || \
           [ "${{ needs.test-mage.result }}" != "success" ]; then
          echo "??  Some tests failed - check test results"
          # Don't exit 1 yet - we want to see test results first
        fi

        echo "? Build completed, check test results"
