name: Build and Test (gvk-string only)

on:
  workflow_dispatch:  # Manual trigger
  push:  # TEMPORARY: To make workflow visible in GitHub UI
    branches:
      - setup-github-actions
    paths:
      - '.github/workflows/build-and-test-docker.yml'
  # After Docker permissions fixed, ready to test!
  # push:
  #   branches:
  #     - trunk
  # pull_request:
  #   branches:
  #     - trunk

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]  # Use any available runner
    timeout-minutes: 30

    # Run inside Docker container - GitHub Actions handles this!
    container:
      image: ubuntu:22.04
      options: --device=/dev/dri --cap-add CAP_PERFMON

    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
    - name: Install Dependencies in Container
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          python3 \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libx11-xcb-dev \
          libxxf86vm-dev \
          xorg-dev

    - name: Fix Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -Dgvk-default_ENABLED=OFF \
          -Dgvk-string_ENABLED=ON \
          -Dgvk-build-tests=ON \
          -Dgvk-build-samples=OFF

    - name: Build gvk-string Tests
      run: |
        # Build the test target - this also builds gvk-string and populates gvk-test-package
        cmake --build build --target gvk-string.tests --parallel $(nproc)

    - name: Verify gvk-test-package Created
      run: |
        echo "=== Contents of gvk-test-package ==="
        ls -lah build/gvk-test-package/ || echo "gvk-test-package not found!"

    - name: Upload Test Package
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: build/gvk-test-package/
        retention-days: 1  # TODO: Increase to 7+ days for production (reduced for debug/development)

  test:
    name: Test on ${{ matrix.runner.name }}
    needs: build
    timeout-minutes: 15

    strategy:
      fail-fast: false  # Run all test jobs even if one fails
      matrix:
        runner:
          - name: "godzilla (NVIDIA RTX 6000)"
            label: nvidia-rtx6000
            check_name: "godzilla - NVIDIA RTX 6000"
          - name: "mage-b580 (Intel B580)"
            label: intel-b580
            check_name: "mage-b580 - Intel B580"

    runs-on: 
      - self-hosted
      - Linux
      - X64
      - ${{ matrix.runner.label }}

    # NOTE: Not using container for test jobs - we need direct GPU access
    # The host already has GPU drivers installed, and containers add complexity
    # for GPU passthrough. Build job uses container because it doesn't need GPU.

    steps:
    - name: Download Test Package
      uses: actions/download-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: gvk-test-package
      # Retry on network failures (common with self-hosted runners)
      timeout-minutes: 10
      continue-on-error: false

    - name: Verify Test Package Downloaded
      run: |
        echo "=== Verifying test package download ==="
        if [ ! -d "gvk-test-package" ]; then
          echo "ERROR: gvk-test-package directory not found!"
          exit 1
        fi

        if [ ! -f "gvk-test-package/gvk-string.tests" ]; then
          echo "ERROR: gvk-string.tests not found in test package!"
          ls -la gvk-test-package/
          exit 1
        fi

        echo "Test package verified successfully"
        ls -lh gvk-test-package/

    - name: Check GPU (Host)
      run: |
        echo "=== GPU Information ==="
        echo "DRI Devices:"
        ls -la /dev/dri/ || echo "No /dev/dri"
        echo ""
        echo "Vulkan ICDs:"
        ls -la /usr/share/vulkan/icd.d/ || echo "No ICDs"
        echo ""
        echo "Vulkan Devices:"
        # Check if vulkaninfo is available, if not suggest installing vulkan-tools
        if command -v vulkaninfo &> /dev/null; then
          vulkaninfo --summary || echo "vulkaninfo failed"
        else
          echo "vulkaninfo not found (install vulkan-tools on host)"
          echo "Using VK_ICD_FILENAMES to probe GPUs..."
          # List available ICDs
          for icd in /usr/share/vulkan/icd.d/*.json; do
            if [ -f "$icd" ]; then
              echo "Found ICD: $(basename $icd)"
            fi
          done
        fi

    - name: List Test Package Contents
      run: |
        echo "=== Test Package Contents ==="
        ls -lah gvk-test-package/

    - name: Run Tests (gvk-string)
      id: run-tests
      working-directory: gvk-test-package
      run: |
        # Make test executable if needed
        chmod +x gvk-string.tests || true

        # Run gvk-string tests with XML output for GitHub integration
        # Full output goes to stdout (for step-by-step inspection)
        # XML output goes to file (for GitHub test results summary)
        echo "=== Running gvk-string.tests ==="

        # Run tests and capture exit code
        set +e
        ./gvk-string.tests --gtest_output=xml:test-results.xml 2>&1 | tee test-output.txt
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        set -e

        echo "Test exit code: $TEST_EXIT_CODE"

        # Show XML file was created
        if [ -f test-results.xml ]; then
          echo "Test results XML generated"
          ls -lh test-results.xml
        else
          echo "WARNING: test-results.xml was not generated!"
        fi

        # Exit with test exit code so job fails if tests fail
        # Note: Removed continue-on-error so test failures are properly reported
        exit $TEST_EXIT_CODE

    - name: Display Test Results
      if: always()
      working-directory: gvk-test-package
      run: |
        echo "## Test Results - ${{ matrix.runner.name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f test-results.xml ]; then
          # Parse XML for accurate test counts
          TESTS=$(grep -oP 'tests="\K\d+' test-results.xml | head -1 || echo "0")
          FAILURES=$(grep -oP 'failures="\K\d+' test-results.xml | head -1 || echo "0")
          ERRORS=$(grep -oP 'errors="\K\d+' test-results.xml | head -1 || echo "0")
          PASSED=$((TESTS - FAILURES - ERRORS))

          if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ] && [ "$TESTS" != "0" ]; then
            echo "**All tests passed:** $TESTS tests" >> $GITHUB_STEP_SUMMARY
          elif [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
            echo "**Some tests failed:** $FAILURES failed, $ERRORS errors, $PASSED passed (of $TESTS total)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Test results unclear**" >> $GITHUB_STEP_SUMMARY
          fi
        elif [ -f test-output.txt ]; then
          # Fallback to text parsing if XML not available
          PASSED=$(grep -oP '\[  PASSED  \] \K\d+' test-output.txt | tail -1 || echo "0")
          FAILED=$(grep -oP '\[  FAILED  \] \K\d+' test-output.txt | tail -1 || echo "0")

          if [ "$FAILED" = "0" ] && [ "$PASSED" != "0" ]; then
            echo "**All tests passed:** $PASSED tests" >> $GITHUB_STEP_SUMMARY
          elif [ "$FAILED" != "0" ]; then
            echo "**Some tests failed:** $FAILED failed, $PASSED passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Test results unclear**" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "**No test output captured**" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Detailed test results available in step logs above" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Upload Test Results (XML)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-xml-${{ matrix.runner.label }}-${{ github.sha }}
        path: gvk-test-package/test-results.xml
        retention-days: 1  # TODO: Increase to 30+ days for production (reduced for debug/development)

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: gvk-test-package/test-results.xml
        check_name: "Test Results (${{ matrix.runner.check_name }})"
        comment_mode: off

  status:
    name: Build & Test Status
    needs: [build, test]
    runs-on: [self-hosted, Linux, X64]
    if: always()
    timeout-minutes: 5

    steps:
    - name: Check Status
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test: ${{ needs.test.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build failed"
          exit 1
        fi

        # Test job result reflects ALL matrix jobs
        # If any test job fails, the overall test result is 'failure'
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test failures detected - check individual test jobs above"
          exit 1
        fi

        echo "Build and all tests passed successfully"
