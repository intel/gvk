
name: Build and Test

on:
  workflow_dispatch:  # Manual trigger
  push:  # TEMPORARY: To make workflow visible in GitHub UI
    branches:
      - setup-github-actions
#    paths:
#      - '.github/workflows/build-and-test-docker.yml'


  # After Docker permissions fixed, ready to test!
  # push:
  #   branches:
  #     - trunk
  # pull_request:
  #   branches:
  #     - trunk

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]  # Use any available runner
    timeout-minutes: 30

    # Run inside Docker container - GitHub Actions handles this!
    container:
      image: ubuntu:22.04
      options: --device=/dev/dri --cap-add CAP_PERFMON

    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
################################################################################
    - name: Install Dependencies in Container
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          python3 \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libx11-xcb-dev \
          libxxf86vm-dev \
          xorg-dev

################################################################################
    - name: Fix Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

################################################################################
    - name: Clean
      run: |
        rm -rf build
        rm -rf install

################################################################################
    - name: Checkout
      uses: actions/checkout@v4
      with:
        clean: true

################################################################################
    - name: Detect Vulkan SDK Version
      id: detect-sdk-version
      run: |
        # Extract Vulkan SDK version from CMakeLists.txt
        SDK_VERSION=$(grep -oP 'set\(gvk-Vulkan-SDK_VERSION \K[0-9.]+' CMakeLists.txt || echo "unknown")
        echo "Detected Vulkan SDK version: $SDK_VERSION"
        echo "sdk-version=$SDK_VERSION" >> $GITHUB_OUTPUT

################################################################################
    - name: Restore Vulkan SDK Cache
      id: cache-vulkan-sdk
      uses: actions/cache@v4
      with:
        path: build/_deps/VulkanSDK
        key: vulkan-sdk-${{ steps.detect-sdk-version.outputs.sdk-version }}-linux-${{ runner.os }}
        restore-keys: |
          vulkan-sdk-${{ steps.detect-sdk-version.outputs.sdk-version }}-linux-
          vulkan-sdk-

    - name: Check Vulkan SDK Cache Status
      run: |
        echo "Required SDK version: ${{ steps.detect-sdk-version.outputs.sdk-version }}"
        if [ "${{ steps.cache-vulkan-sdk.outputs.cache-hit }}" = "true" ]; then
          echo "? Vulkan SDK restored from cache"
          ls -lh build/_deps/VulkanSDK/ || echo "Cache directory exists but empty"
        else
          echo "? Vulkan SDK not in cache, will be downloaded during configure"
        fi

################################################################################
    - name: Configure
      run: |
        cmake --version
        cmake -G "Unix Makefiles" -B build \
          -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -D gvk-default_ENABLED=OFF \
          -D gvk-reference_ENABLED=ON \
          -D gvk-runtime_ENABLED=ON \
          -D gvk-string_ENABLED=ON \
          -D gvk-xml_ENABLED=ON \
          -D gvk-build-tests=ON \
          -D gvk-build-samples=OFF

################################################################################
    - name: Cache Vulkan SDK
      if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build/_deps/VulkanSDK
        key: vulkan-sdk-${{ steps.detect-sdk-version.outputs.sdk-version }}-linux-${{ runner.os }}

    - name: Verify Vulkan SDK Cached
      run: |
        echo "SDK Version: ${{ steps.detect-sdk-version.outputs.sdk-version }}"
        if [ -d "build/_deps/VulkanSDK" ]; then
          echo "? Vulkan SDK directory exists"
          ls -lh build/_deps/VulkanSDK/
        else
          echo "? Vulkan SDK directory not found (may not be needed for this build)"
        fi

################################################################################
    - name: Build
      run: cmake --build build --target install --parallel $(nproc)

################################################################################
    - name: Verify gvk-test-package Created
      run: |
        echo "=== Contents of gvk-test-package ==="
        ls -lah build/gvk-test-package/ || echo "gvk-test-package not found!"

################################################################################
    - name: Upload Test Package
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: build/gvk-test-package/
        retention-days: 1  # TODO: Increase to 7+ days for production (reduced for debug/development)

  test:
    name: Test on ${{ matrix.runner.name }}
    needs: build
    timeout-minutes: 15

    strategy:
      fail-fast: false  # Run all test jobs even if one fails
      matrix:
        runner:
          - name: "godzilla (NVIDIA RTX 6000)"
            label: nvidia-rtx6000
            check_name: "godzilla - NVIDIA RTX 6000"
          - name: "mage-b580 (Intel B580)"
            label: intel-b580
            check_name: "mage-b580 - Intel B580"

    runs-on: 
      - self-hosted
      - Linux
      - X64
      - ${{ matrix.runner.label }}

    # NOTE: Not using container for test jobs - we need direct GPU access
    # The host already has GPU drivers installed, and containers add complexity
    # for GPU passthrough. Build job uses container because it doesn't need GPU.

    steps:
################################################################################
    - name: Download Test Package
      uses: actions/download-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: gvk-test-package
      # Retry on network failures (common with self-hosted runners)
      timeout-minutes: 10
      continue-on-error: false

    - name: Verify Test Package Downloaded
      run: |
        echo "=== Verifying test package download ==="
        if [ ! -d "gvk-test-package" ]; then
          echo "ERROR: gvk-test-package directory not found!"
          exit 1
        fi

        if [ ! -f "gvk-test-package/gvk-string.tests" ]; then
          echo "ERROR: gvk-string.tests not found in test package!"
          ls -la gvk-test-package/
          exit 1
        fi

        echo "Test package verified successfully"
        ls -lh gvk-test-package/

################################################################################
    - name: Log Hardware System Information
      run: |
        echo "=== CPU Information ==="
        lscpu | grep -E "Model name|Core\(s\) per socket|Socket\(s\)|Thread\(s\) per core"
        
        echo -e "\n=== Total CPU Cores ==="
        nproc
        
        echo -e "\n=== Memory Information ==="
        free -h
        
        echo -e "\n=== Disk Space Usage ==="
        df -h /

      - name: Log Software and Tool Versions
        run: |
          echo "=== Compiler Versions ==="
          gcc --version | head -n 1 || echo "gcc not installed"
          g++ --version | head -n 1 || echo "g++ not installed"
          clang --version | head -n 1 || echo "clang not installed"
          
          echo -e "\n=== Build & Runtime Tools ==="
          cmake --version | head -n 1 || echo "cmake not installed"
          python3 --version || echo "python3 not installed"
          
          echo -e "\n=== System C Library (glibc) Version ==="
          ldd --version | head -n 1 || echo "ldd not found"

################################################################################
    - name: Check GPU (Host)
      run: |
        echo "=== GPU Information ==="
        echo "DRI Devices:"
        ls -la /dev/dri/ || echo "No /dev/dri"
        echo ""
        echo "Vulkan ICDs:"
        ls -la /usr/share/vulkan/icd.d/ || echo "No ICDs"
        echo ""
        echo "Vulkan Devices:"
        # Check if vulkaninfo is available, if not suggest installing vulkan-tools
        if command -v vulkaninfo &> /dev/null; then
          vulkaninfo --summary || echo "vulkaninfo failed"
        else
          echo "vulkaninfo not found (install vulkan-tools on host)"
          echo "Using VK_ICD_FILENAMES to probe GPUs..."
          # List available ICDs
          for icd in /usr/share/vulkan/icd.d/*.json; do
            if [ -f "$icd" ]; then
              echo "Found ICD: $(basename $icd)"
            fi
          done
        fi

    - name: List Test Package Contents
      run: |
        echo "=== Test Package Contents ==="
        ls -lah gvk-test-package/
        echo ""
        echo "=== Test Executables Found ==="
        find gvk-test-package -name "*.tests" -type f -executable

################################################################################
      - name: Check Docker GPU Capabilities
        id: gpu_check
        # Continue running the pipeline even if this specific step fails
        continue-on-error: true
        run: |
          echo "=== Testing Docker GPU Pass-through ==="
          if docker run --rm --gpus all ubuntu:22.04 nvidia-smi > /dev/null 2>&1; then
            echo "SUCCESS: Docker GPU acceleration is fully functional."
            echo "has_gpu=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Docker GPU acceleration is NOT available on this runner."
            echo "has_gpu=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute Tests With Full GPU Power
        # This step only executes if the check above returned true
        if: steps.gpu_check.outputs.has_gpu == 'true'
        run: |
          chmod +x ./gvk-reference.tests
          ./gvk-reference.tests

      - name: Log Warning If Skipped
        if: steps.gpu_check.outputs.has_gpu != 'true'
        run: |
          echo "Skipping test execution block because this machine lacks a configured NVIDIA Docker runtime."

################################################################################
    - name: Run Tests
      id: run-tests
      working-directory: gvk-test-package
      run: |
        # Make all test executables executable
        chmod +x *.tests 2>/dev/null || true

        # Run all test executables and collect results
        echo "=== Running All Tests ==="

        OVERALL_EXIT_CODE=0
        TEST_COUNT=0

        # Find all .tests executables
        for test_exe in *.tests; do
          if [ -x "$test_exe" ]; then
            TEST_COUNT=$((TEST_COUNT + 1))
            echo ""
            echo "=========================================="
            echo "Running: $test_exe"
            echo "=========================================="

            # Generate unique XML filename for each test suite
            xml_file="${test_exe%.tests}-results.xml"

            # Run test and capture output
            set +e
            ./"$test_exe" --gtest_output=xml:"$xml_file" 2>&1 | tee "${test_exe%.tests}-output.txt"
            EXIT_CODE=${PIPESTATUS[0]}
            set -e

            echo "$test_exe exit code: $EXIT_CODE"

            # Track if any test failed
            if [ $EXIT_CODE -ne 0 ]; then
              OVERALL_EXIT_CODE=$EXIT_CODE
              echo "WARNING: $test_exe failed!"
            fi

            # Verify XML was created
            if [ -f "$xml_file" ]; then
              echo "$xml_file generated successfully"
            else
              echo "WARNING: $xml_file was not generated!"
            fi
          fi
        done

        echo ""
        echo "=========================================="
        echo "Test Execution Summary"
        echo "=========================================="
        echo "Test executables run: $TEST_COUNT"
        echo "Overall exit code: $OVERALL_EXIT_CODE"

        # List all generated XML files
        echo ""
        echo "XML Results Files:"
        ls -lh *-results.xml 2>/dev/null || echo "No XML files generated"

        # Exit with failure if any test failed
        exit $OVERALL_EXIT_CODE

################################################################################
    - name: Display Test Results
      if: always() && steps.run-tests.outcome != 'skipped'
      working-directory: gvk-test-package
      run: |
        echo "## Test Results - ${{ matrix.runner.name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Aggregate results from all XML files
        TOTAL_TESTS=0
        TOTAL_FAILURES=0
        TOTAL_ERRORS=0
        XML_COUNT=0

        for xml_file in *-results.xml; do
          if [ -f "$xml_file" ]; then
            XML_COUNT=$((XML_COUNT + 1))

            # Parse this XML file
            TESTS=$(grep -oP 'tests="\K\d+' "$xml_file" | head -1 || echo "0")
            FAILURES=$(grep -oP 'failures="\K\d+' "$xml_file" | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors="\K\d+' "$xml_file" | head -1 || echo "0")

            # Aggregate totals
            TOTAL_TESTS=$((TOTAL_TESTS + TESTS))
            TOTAL_FAILURES=$((TOTAL_FAILURES + FAILURES))
            TOTAL_ERRORS=$((TOTAL_ERRORS + ERRORS))

            # Show per-suite results
            SUITE_NAME="${xml_file%-results.xml}"
            SUITE_PASSED=$((TESTS - FAILURES - ERRORS))
            echo "- **$SUITE_NAME**: $SUITE_PASSED/$TESTS passed" >> $GITHUB_STEP_SUMMARY
          fi
        done

        if [ $XML_COUNT -gt 0 ]; then
          TOTAL_PASSED=$((TOTAL_TESTS - TOTAL_FAILURES - TOTAL_ERRORS))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Overall Results" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL_FAILURES" = "0" ] && [ "$TOTAL_ERRORS" = "0" ] && [ "$TOTAL_TESTS" != "0" ]; then
            echo "**All tests passed:** $TOTAL_TESTS tests across $XML_COUNT suites" >> $GITHUB_STEP_SUMMARY
          elif [ "$TOTAL_FAILURES" != "0" ] || [ "$TOTAL_ERRORS" != "0" ]; then
            echo "**Some tests failed:** $TOTAL_FAILURES failed, $TOTAL_ERRORS errors, $TOTAL_PASSED passed (of $TOTAL_TESTS total)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Test results unclear**" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "**No test output captured**" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Detailed test results available in step logs above" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

################################################################################
    - name: Upload Test Results (XML)
      if: always() && steps.run-tests.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: test-results-xml-${{ matrix.runner.label }}-${{ github.sha }}
        path: gvk-test-package/*-results.xml
        retention-days: 1  # TODO: Increase to 30+ days for production (reduced for debug/development)

################################################################################
    - name: Publish Test Results
      if: always() && steps.run-tests.outcome != 'skipped'
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: gvk-test-package/*-results.xml
        check_name: "Test Results (${{ matrix.runner.check_name }})"
        comment_mode: off

  status:
    name: Build & Test Status
    needs: [build, test]
    runs-on: [self-hosted, Linux, X64]
    if: always()
    timeout-minutes: 5

    steps:
################################################################################
    - name: Check Status
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test: ${{ needs.test.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build failed"
          exit 1
        fi

        # Test job result reflects ALL matrix jobs
        # If any test job fails, the overall test result is 'failure'
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test failures detected - check individual test jobs above"
          exit 1
        fi

        echo "Build and all tests passed successfully"
