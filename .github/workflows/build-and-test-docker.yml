
name: Build and Test

on:
  workflow_dispatch:  # Manual trigger
  push:  # TEMPORARY: To make workflow visible in GitHub UI
    branches:
      - setup-github-actions
#    paths:
#      - '.github/workflows/build-and-test-docker.yml'


  # After Docker permissions fixed, ready to test!
  # push:
  #   branches:
  #     - trunk
  # pull_request:
  #   branches:
  #     - trunk

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]  # Use any available runner
    timeout-minutes: 30

    # Run inside Docker container - GitHub Actions handles this!
    container:
      image: ubuntu:22.04
      options: --device=/dev/dri --cap-add CAP_PERFMON

    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
################################################################################
    - name: Install Dependencies in Container
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          python3 \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libx11-xcb-dev \
          libxxf86vm-dev \
          xorg-dev

################################################################################
    - name: Fix Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

################################################################################
    - name: Clean
      run: |
        rm -rf build
        rm -rf install

################################################################################
    - name: Checkout
      uses: actions/checkout@v4
      with:
        clean: true

################################################################################
    - name: Detect Vulkan SDK Version
      id: detect-sdk-version
      run: |
        # Extract Vulkan SDK version from CMakeLists.txt
        SDK_VERSION=$(grep -oP 'set\(gvk-Vulkan-SDK_VERSION \K[0-9.]+' CMakeLists.txt || echo "unknown")
        echo "Detected Vulkan SDK version: $SDK_VERSION"
        echo "sdk-version=$SDK_VERSION" >> $GITHUB_OUTPUT

################################################################################
    - name: Restore Vulkan SDK Cache
      id: cache-vulkan-sdk
      uses: actions/cache@v4
      with:
        path: build/_deps/VulkanSDK
        key: vulkan-sdk-${{ steps.detect-sdk-version.outputs.sdk-version }}-linux-${{ runner.os }}
        restore-keys: |
          vulkan-sdk-${{ steps.detect-sdk-version.outputs.sdk-version }}-linux-
          vulkan-sdk-

    - name: Check Vulkan SDK Cache Status
      run: |
        echo "Required SDK version: ${{ steps.detect-sdk-version.outputs.sdk-version }}"
        if [ "${{ steps.cache-vulkan-sdk.outputs.cache-hit }}" = "true" ]; then
          echo "? Vulkan SDK restored from cache"
          ls -lh build/_deps/VulkanSDK/ || echo "Cache directory exists but empty"
        else
          echo "? Vulkan SDK not in cache, will be downloaded during configure"
        fi

################################################################################
    - name: Configure
      run: |
        cmake --version
        cmake -G "Unix Makefiles" -B build \
          -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -D gvk-default_ENABLED=OFF \
          -D gvk-reference_ENABLED=ON \
          -D gvk-runtime_ENABLED=ON \
          -D gvk-string_ENABLED=ON \
          -D gvk-xml_ENABLED=ON \
          -D gvk-build-tests=ON \
          -D gvk-build-samples=OFF

################################################################################
    - name: Cache Vulkan SDK
      if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build/_deps/VulkanSDK
        key: vulkan-sdk-${{ steps.detect-sdk-version.outputs.sdk-version }}-linux-${{ runner.os }}

    - name: Verify Vulkan SDK Cached
      run: |
        echo "SDK Version: ${{ steps.detect-sdk-version.outputs.sdk-version }}"
        if [ -d "build/_deps/VulkanSDK" ]; then
          echo "? Vulkan SDK directory exists"
          ls -lh build/_deps/VulkanSDK/
        else
          echo "? Vulkan SDK directory not found (may not be needed for this build)"
        fi

################################################################################
    - name: Build
      run: cmake --build build --target install --parallel $(nproc)

################################################################################
    - name: Verify gvk-test-package Created
      run: |
        echo "=== Contents of gvk-test-package ==="
        ls -lah build/gvk-test-package/ || echo "gvk-test-package not found!"

################################################################################
    - name: Upload Test Package
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: build/gvk-test-package/
        retention-days: 1  # TODO: Increase to 7+ days for production (reduced for debug/development)

  test:
    name: Test on ${{ matrix.runner.name }}
    needs: build
    timeout-minutes: 15

    strategy:
      fail-fast: false  # Run all test jobs even if one fails
      matrix:
        runner:
          - name: "godzilla (NVIDIA RTX 6000)"
            label: nvidia-rtx6000
            check_name: "godzilla - NVIDIA RTX 6000"
            container_options: "--gpus all"
            gpu_vendor: "nvidia"
          - name: "mage-b580 (Intel B580)"
            label: intel-b580
            check_name: "mage-b580 - Intel B580"
            container_options: "--device=/dev/dri --group-add video"
            gpu_vendor: "intel"

    runs-on: 
      - self-hosted
      - Linux
      - X64
      - ${{ matrix.runner.label }}

    # NOTE: Cannot use job-level 'container:' with --gpus flag
    # GitHub Actions' container feature doesn't support --gpus (uses docker create, not docker run)
    # Solution: Run steps on host, use manual docker run for test execution

################################################################################
    steps:
#==============================================================================#
    - name: Download Test Package
      uses: actions/download-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: gvk-test-package
      timeout-minutes: 10
      continue-on-error: false

    - name: Verify Test Package Downloaded
      run: |
        echo "=== Verifying test package download ==="
        if [ ! -d "gvk-test-package" ]; then
          echo "ERROR: gvk-test-package directory not found!"
          exit 1
        fi

        if [ ! -f "gvk-test-package/gvk-string.tests" ]; then
          echo "ERROR: gvk-string.tests not found in test package!"
          ls -la gvk-test-package/
          exit 1
        fi

        echo "Test package verified successfully"
        ls -lh gvk-test-package/

#==============================================================================#
    - name: Check Container Environment
      run: |
        echo "=== Checking Docker and Container Runtime ==="
        docker --version
        echo ""

        echo "=== Testing Container Startup ==="
        docker run --rm ubuntu:22.04 bash -c '
          echo "Container OS:"
          cat /etc/os-release | head -3
          echo ""
          echo "glibc version:"
          ldd --version | head -1
        '

#==============================================================================#
    - name: Install GPU Drivers in Container Image
      run: |
        echo "=== Building container image with GPU drivers ==="
        echo "GPU Vendor: ${{ matrix.runner.gpu_vendor }}"
        echo ""

        # Create a Dockerfile with GPU-specific drivers
        cat > Dockerfile.gpu-test <<DOCKERFILE
        FROM ubuntu:22.04

        ENV DEBIAN_FRONTEND=noninteractive

        RUN apt-get update -qq && \\
            apt-get install -y -qq \\
              libwayland-client0 \\
              libxkbcommon0 \\
              libx11-6 \\
              libxext6 \\
              libxcb1 \\
              ca-certificates \\
              wget \\
              gpg \\
              software-properties-common

        # Install Intel GPU drivers if needed
        ARG GPU_VENDOR=unknown
        RUN if [ "\$GPU_VENDOR" = "intel" ]; then \\
              echo "Installing Intel Graphics PPA..." && \\
              wget -qO - https://repositories.intel.com/gpu/intel-graphics.key | \\
                gpg --dearmor --output /usr/share/keyrings/intel-graphics.gpg && \\
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/intel-graphics.gpg] \\
                https://repositories.intel.com/gpu/ubuntu jammy client" \\
                > /etc/apt/sources.list.d/intel-graphics.list && \\
              apt-get update -qq && \\
              apt-get install -y -qq \\
                intel-opencl-icd \\
                intel-level-zero-gpu \\
                level-zero \\
                mesa-vulkan-drivers \\
                libigdgmm12 \\
                vulkan-tools && \\
              echo "Intel GPU drivers installed"; \\
            elif [ "\$GPU_VENDOR" = "nvidia" ]; then \\
              apt-get install -y -qq mesa-vulkan-drivers vulkan-tools; \\
            fi

        RUN apt-get clean && rm -rf /var/lib/apt/lists/*
        DOCKERFILE

        # Build image with GPU-specific drivers
        docker build \
          --build-arg GPU_VENDOR=${{ matrix.runner.gpu_vendor }} \
          -t gvk-test-${{ matrix.runner.gpu_vendor }}:local \
          -f Dockerfile.gpu-test \
          .

        echo ""
        echo "Container image built: gvk-test-${{ matrix.runner.gpu_vendor }}:local"

#==============================================================================#
    - name: Check Host GPU Setup
      run: |
        echo "=========================================="
        echo "=== HOST GPU DIAGNOSTICS ==="
        echo "=========================================="
        echo ""
        echo "--- GPU Vendor: ${{ matrix.runner.gpu_vendor }} ---"
        echo ""

        if [ "${{ matrix.runner.gpu_vendor }}" = "nvidia" ]; then
          echo "=== NVIDIA Driver Check ==="
          if command -v nvidia-smi &> /dev/null; then
            echo "? nvidia-smi found"
            nvidia-smi
          else
            echo "? nvidia-smi NOT found - NVIDIA drivers may not be installed on host"
          fi
          echo ""

          echo "=== NVIDIA Kernel Modules ==="
          if lsmod | grep -i nvidia &> /dev/null; then
            echo "? NVIDIA kernel modules loaded:"
            lsmod | grep -i nvidia
          else
            echo "? No NVIDIA kernel modules loaded"
          fi
          echo ""

          echo "=== NVIDIA Device Nodes ==="
          if ls /dev/nvidia* &> /dev/null; then
            echo "? NVIDIA device nodes exist:"
            ls -la /dev/nvidia*
          else
            echo "? No NVIDIA device nodes found"
          fi
          echo ""

          echo "=== Docker NVIDIA Runtime ==="
          if docker info 2>/dev/null | grep -i nvidia &> /dev/null; then
            echo "? NVIDIA runtime detected:"
            docker info 2>/dev/null | grep -i runtime
          else
            echo "? NVIDIA runtime NOT detected in Docker"
            echo "Available runtimes:"
            docker info 2>/dev/null | grep -i runtime
          fi
          echo ""

          echo "=== NVIDIA Container Toolkit ==="
          if command -v nvidia-container-cli &> /dev/null; then
            echo "? nvidia-container-cli found"
            nvidia-container-cli --version
            echo ""
            echo "NVIDIA Container CLI info:"
            nvidia-container-cli info || echo "Failed to get container info"
          else
            echo "? nvidia-container-cli NOT found - Container Toolkit may not be installed"
          fi
          echo ""

        else
          echo "=== DRI/Intel GPU Check ==="
          if ls /dev/dri/* &> /dev/null; then
            echo "? DRI devices found:"
            ls -la /dev/dri/
          else
            echo "? No DRI devices found"
          fi
        fi

        echo ""
        echo "=========================================="
        echo "=== END HOST DIAGNOSTICS ==="
        echo "=========================================="

#==============================================================================#
    - name: Test Docker --gpus Flag Variations
      if: matrix.runner.gpu_vendor == 'nvidia'
      run: |
        echo "=========================================="
        echo "=== Testing different --gpus flag variations ==="
        echo "=========================================="
        echo ""

        echo "Test 1: --gpus all"
        docker run --rm --gpus all ubuntu:22.04 bash -c 'echo "NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES"' || echo "FAILED"
        echo ""

        echo "Test 2: --gpus 'all,capabilities=compute'"
        docker run --rm --gpus 'all,capabilities=compute' ubuntu:22.04 bash -c 'echo "NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES"' || echo "FAILED"
        echo ""

        echo "Test 3: --gpus 'all,\"capabilities=compute,utility,graphics\"'"
        docker run --rm --gpus 'all,"capabilities=compute,utility,graphics"' ubuntu:22.04 bash -c 'echo "NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES"' || echo "FAILED"
        echo ""

        echo "Test 4: --runtime=nvidia (legacy)"
        docker run --rm --runtime=nvidia ubuntu:22.04 bash -c 'echo "NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES"' || echo "FAILED"
        echo ""

        echo "Test 5: --gpus 0 (specific GPU)"
        docker run --rm --gpus 0 ubuntu:22.04 bash -c 'echo "NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES"' || echo "FAILED"
        echo ""

        echo "Test 6: --runtime=nvidia with manual env vars"
        docker run --rm --runtime=nvidia -e NVIDIA_VISIBLE_DEVICES=all -e NVIDIA_DRIVER_CAPABILITIES=all ubuntu:22.04 bash -c 'echo "NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES" && echo "NVIDIA_DRIVER_CAPABILITIES=$NVIDIA_DRIVER_CAPABILITIES"' || echo "FAILED"
        echo ""

        echo "Test 7: Check if nvidia-smi works with --runtime=nvidia"
        docker run --rm --runtime=nvidia -e NVIDIA_VISIBLE_DEVICES=all -e NVIDIA_DRIVER_CAPABILITIES=all ubuntu:22.04 bash -c 'ls -la /usr/local/nvidia/lib64/ 2>/dev/null | head -5 || echo "No libs mounted"' || echo "FAILED"
        echo ""

        echo "Test 8: Check Docker daemon NVIDIA configuration"
        cat /etc/docker/daemon.json 2>/dev/null || echo "No daemon.json found"
        echo ""

        echo "Test 9: Check NVIDIA Container Runtime config"
        cat /etc/nvidia-container-runtime/config.toml 2>/dev/null || echo "No config.toml found"
        echo ""

        echo "Test 10: Try bypassing runtime entirely - manual device mount"
        docker run --rm \
          --device=/dev/nvidia0:/dev/nvidia0 \
          --device=/dev/nvidiactl:/dev/nvidiactl \
          --device=/dev/nvidia-uvm:/dev/nvidia-uvm \
          --device=/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools \
          ubuntu:22.04 bash -c 'ls -la /dev/nvidia* && echo "Devices accessible!"' || echo "FAILED"
        echo ""

#==============================================================================#
    - name: Check GPU Access in Container
      run: |
        echo "=== GPU Vendor: ${{ matrix.runner.gpu_vendor }} ==="
        echo "=== Docker GPU options: ${{ matrix.runner.container_options }} ==="
        echo ""

        docker run --rm \
          ${{ matrix.runner.container_options }} \
          gvk-test-${{ matrix.runner.gpu_vendor }}:local \
          bash -c '
            echo "=== GPU Device Detection ==="

            if [ "${{ matrix.runner.gpu_vendor }}" = "nvidia" ]; then
              echo "NVIDIA devices in container:"
              ls -la /dev/nvidia* 2>/dev/null || echo "? No NVIDIA devices"
              echo ""

              echo "NVIDIA Container Toolkit libraries:"
              if [ -d "/usr/local/nvidia/lib64" ]; then
                echo "? NVIDIA libraries mounted at /usr/local/nvidia/lib64:"
                ls /usr/local/nvidia/lib64/ 2>/dev/null | head -10
                echo ""
                echo "Total library files: $(ls /usr/local/nvidia/lib64/ | wc -l)"
              else
                echo "? /usr/local/nvidia/lib64 not found"
                echo "  This means --gpus all did not mount NVIDIA drivers"
                echo "  Check: docker info | grep -i runtime"
              fi
              echo ""

              echo "NVIDIA environment variables:"
              echo "  LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
              echo "  NVIDIA_VISIBLE_DEVICES=$NVIDIA_VISIBLE_DEVICES"
              echo "  NVIDIA_DRIVER_CAPABILITIES=$NVIDIA_DRIVER_CAPABILITIES"

            else
              echo "Intel/DRI devices in container:"
              ls -la /dev/dri/ 2>/dev/null || echo "? No DRI devices"
            fi
          '

#==============================================================================#
    - name: Check Vulkan in Container
      run: |
        echo "=== Vulkan Device Detection ==="
        echo ""

        docker run --rm \
          ${{ matrix.runner.container_options }} \
          gvk-test-${{ matrix.runner.gpu_vendor }}:local \
          bash -c '
            export DISPLAY=:0
            export XDG_RUNTIME_DIR=/tmp

            echo "Vulkan tools version:"
            vulkaninfo --version 2>&1 | head -3
            echo ""

            echo "=== Vulkan GPU Detection ==="
            vulkaninfo --summary 2>&1 | head -100
          '

#==============================================================================#
    - name: Run Tests in Docker Container
      id: run-tests
      run: |
        echo "=== Running all tests in Ubuntu 22.04 container with GPU access ==="
        echo "GPU Vendor: ${{ matrix.runner.gpu_vendor }}"
        echo "Container options: ${{ matrix.runner.container_options }}"
        echo ""

        # Run tests inside Docker container with pre-installed drivers
        docker run --rm \
          ${{ matrix.runner.container_options }} \
          -v "$(pwd)/gvk-test-package:/workspace" \
          -w /workspace \
          -e DISPLAY=:0 \
          -e XDG_RUNTIME_DIR=/tmp \
          gvk-test-${{ matrix.runner.gpu_vendor }}:local \
          bash -c '
            set -e

            echo "=== Test Package Contents ==="
            ls -lh *.tests 2>/dev/null || echo "No test executables found"
            echo ""

            # Make test executables runnable
            chmod +x *.tests 2>/dev/null || true

            echo "=== Running Tests ==="
            ls -lh *.tests 2>/dev/null || echo "No test executables found"
            echo ""

            # Make test executables runnable
            chmod +x *.tests 2>/dev/null || true

            echo "=== Running Tests ==="
            OVERALL_EXIT_CODE=0
            TEST_COUNT=0

            for test_exe in *.tests; do
              if [ -f "$test_exe" ]; then
                TEST_COUNT=$((TEST_COUNT + 1))
                echo ""
                echo "=========================================="
                echo "Running: $test_exe"
                echo "=========================================="

                set +e
                ./"$test_exe" --gtest_output=xml:"${test_exe%.tests}-results.xml"
                EXIT_CODE=$?
                set -e

                echo "$test_exe exit code: $EXIT_CODE"

                if [ $EXIT_CODE -ne 0 ]; then
                  OVERALL_EXIT_CODE=$EXIT_CODE
                  echo "WARNING: $test_exe failed!"
                fi
              fi
            done

            echo ""
            echo "=========================================="
            echo "Test Execution Summary"
            echo "=========================================="
            echo "Test executables run: $TEST_COUNT"
            echo "Overall exit code: $OVERALL_EXIT_CODE"

            exit $OVERALL_EXIT_CODE
          '

  status:
    name: Build & Test Status
    needs: [build, test]
    runs-on: [self-hosted, Linux, X64]
    if: always()
    timeout-minutes: 5

################################################################################
    steps:
#==============================================================================#
    - name: Check Status
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test: ${{ needs.test.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build failed"
          exit 1
        fi

        # Test job result reflects ALL matrix jobs
        # If any test job fails, the overall test result is 'failure'
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test failures detected - check individual test jobs above"
          exit 1
        fi

        echo "Build and all tests passed successfully"
