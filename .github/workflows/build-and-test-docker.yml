name: Build and Test (gvk-string only)
name: Build and Test (gvk-string only)

on:
  workflow_dispatch:  # Manual trigger
  push:  # TEMPORARY: To make workflow visible in GitHub UI
    branches:
      - setup-github-actions
    paths:
      - '.github/workflows/build-and-test-docker.yml'
  # After Docker permissions fixed, ready to test!
  # push:
  #   branches:
  #     - trunk
  # pull_request:
  #   branches:
  #     - trunk

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]  # Use any available runner
    timeout-minutes: 30

    # Run inside Docker container - GitHub Actions handles this!
    container:
      image: ubuntu:22.04
      options: --device=/dev/dri --cap-add CAP_PERFMON

    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
    - name: Install Dependencies in Container
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          python3 \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libx11-xcb-dev \
          libxxf86vm-dev \
          xorg-dev

    - name: Fix Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -Dgvk-default_ENABLED=OFF \
          -Dgvk-string_ENABLED=ON \
          -Dgvk-build-tests=ON \
          -Dgvk-build-samples=OFF

    - name: Build gvk-string Tests
      run: |
        # Build the test target - this also builds gvk-string and populates gvk-test-package
        cmake --build build --target gvk-string.tests --parallel $(nproc)

    - name: Verify gvk-test-package Created
      run: |
        echo "=== Contents of gvk-test-package ==="
        ls -lah build/gvk-test-package/ || echo "gvk-test-package not found!"

    - name: Upload Test Package
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: build/gvk-test-package/
        retention-days: 7

  test-godzilla:
    name: Test on godzilla (NVIDIA RTX 6000)
    needs: build
    runs-on: [self-hosted, Linux, X64, nvidia-rtx6000]
    timeout-minutes: 15

    container:
      image: ubuntu:22.04
      options: --device=/dev/dri --cap-add CAP_PERFMON

    steps:
    - name: Download Test Package
      uses: actions/download-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: gvk-test-package

    - name: Install Test Dependencies
      run: |
        apt-get update
        apt-get install -y \
          libwayland-dev \
          libxkbcommon-dev \
          libx11-xcb-dev \
          vulkan-tools \
          mesa-vulkan-drivers

    - name: Check GPU
      run: |
        echo "=== GPU Information ==="
        ls -la /dev/dri/ || echo "No /dev/dri"
        vulkaninfo --summary || echo "vulkaninfo failed"

    - name: List Test Package Contents
      run: |
        echo "=== Test Package Contents ==="
        ls -lah gvk-test-package/

    - name: Run Tests (gvk-string)
      working-directory: gvk-test-package
      run: |
        # Make test executable if needed
        chmod +x gvk-string.tests || true

        # Run gvk-string tests directly from test package
        echo "=== Running gvk-string.tests ==="
        ./gvk-string.tests || true
        echo "Test run completed (continue-on-error enabled)"
      continue-on-error: true

    - name: Display Test Results
      if: always()
      run: |
        echo "## Test Results - godzilla (NVIDIA RTX 6000)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Tests executed from gvk-test-package" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  test-mage:
    name: Test on mage-b580 (Intel B580)
    needs: build
    runs-on: [self-hosted, Linux, X64, intel-b580]
    timeout-minutes: 15

    container:
      image: ubuntu:22.04
      options: --device=/dev/dri --cap-add CAP_PERFMON

    steps:
    - name: Download Test Package
      uses: actions/download-artifact@v4
      with:
        name: gvk-test-package-${{ github.sha }}
        path: gvk-test-package

    - name: Install Test Dependencies
      run: |
        apt-get update
        apt-get install -y \
          libwayland-dev \
          libxkbcommon-dev \
          libx11-xcb-dev \
          vulkan-tools \
          mesa-vulkan-drivers

    - name: Check GPU
      run: |
        echo "=== GPU Information ==="
        ls -la /dev/dri/ || echo "No /dev/dri"
        vulkaninfo --summary || echo "vulkaninfo failed"

    - name: List Test Package Contents
      run: |
        echo "=== Test Package Contents ==="
        ls -lah gvk-test-package/

    - name: Run Tests (gvk-string)
      working-directory: gvk-test-package
      run: |
        # Make test executable if needed
        chmod +x gvk-string.tests || true

        # Run gvk-string tests directly from test package
        echo "=== Running gvk-string.tests ==="
        ./gvk-string.tests || true
        echo "Test run completed (continue-on-error enabled)"
      continue-on-error: true

    - name: Display Test Results
      if: always()
      run: |
        echo "## Test Results - mage-b580 (Intel B580)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Tests executed from gvk-test-package" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  status:
    name: Build & Test Status
    needs: [build, test-godzilla, test-mage]
    runs-on: [self-hosted, Linux, X64]
    if: always()
    timeout-minutes: 5

    steps:
    - name: Check Status
      run: |
        echo "Build: ${{ needs.build.result }}"
        echo "Test godzilla (NVIDIA): ${{ needs.test-godzilla.result }}"
        echo "Test mage-b580 (Intel): ${{ needs.test-mage.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "? Build failed"
          exit 1
        fi

        # Test failures are warnings, not hard failures (for now)
        if [ "${{ needs.test-godzilla.result }}" != "success" ] || \
           [ "${{ needs.test-mage.result }}" != "success" ]; then
          echo "??  Some tests failed - check test results"
          # Don't exit 1 yet - we want to see test results first
        fi

        echo "? Build completed, check test results"
